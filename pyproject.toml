[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "melanoma-spatial-ici"
version = "0.1.0"
description = "Reproducible single-cell-to-spatial analysis of melanoma immunotherapy response"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {file = "LICENSE"}
authors = [{name = "Chathura J. Gunasekara"}]
dependencies = [
  "anndata>=0.11,<0.13",
  "matplotlib>=3.9,<4",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pyyaml>=6,<7",
  "scanpy>=1.10,<2",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "seaborn>=0.13,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/melanoma_spatial_ici"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
